<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin - Leaderboard</title>
    <link rel="stylesheet" href="styles/style.css" />
  </head>
  <body>
    <h1>새로운 팀 입력</h1>
    <form id="timeForm">
      <label for="name">Name:</label>
      <input type="text" id="name" required />

      <label for="minutes">Minutes:</label>
      <input type="number" id="minutes" min="0" required />

      <label for="seconds">Seconds:</label>
      <input type="number" id="seconds" min="0" max="59" required />

      <label for="milliseconds">Milliseconds:</label>
      <input type="number" id="milliseconds" min="0" max="99" required />

      <button type="submit">Submit</button>
    </form>

    <h1 id="leaderboardTitle">순위표</h1>
    <table id="leaderboard"></table>

    <script src="src/submit.js"></script>
    <script src="src/leaderboard.js"></script>
  </body>
</html>
